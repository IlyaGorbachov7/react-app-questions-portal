version: '3'

services:
  react_app:
    build:
      context: .  # либо укажите путь к каталогу с Dockerfile
    volumes:
      - .:/app
      - /app/node_modules  # чтобы не перезаписывать установленные пакеты
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true  # поможет корректной работе наблюдения за файлами в контейнере
      - API_SERVER=http://question_portal:8080